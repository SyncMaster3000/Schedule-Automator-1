services:
  - type: web
    name: schedule-automator-demo
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/healthz
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DEMO_ADMIN_TOKEN
        sync: false
      - key: SALES_CONTACT_URL
        value: https://t.me/SyncMaster3000
      - key: WEB_PUBLIC_DIR
        value: /app/artifacts/schedule/dist/public
      - key: MIGRATIONS_DIR
        value: /app/lib/db/migrations
      - key: SCHEDULE_TEMPLATES_DIR
        value: /app/artifacts/api-server/templates
